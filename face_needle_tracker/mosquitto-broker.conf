# Part 3 - Mosquitto LAN broker config.
# Mosquitto's stock config has NO listener line, so it binds loopback only and
# the ESP8266 on Wi-Fi can never reach it. The Mosquitto Windows service is run
# with  `-c <this-file>`  (see set-broker-service.ps1 helpers / main README):
#
#   "C:\Program Files\Mosquitto\mosquitto.exe" run -c face_needle_tracker\mosquitto-broker.conf
#
# One-time firewall rule (elevated):  New-NetFirewallRule -DisplayName 'Mosquitto MQTT'
#   -Direction Inbound -Protocol TCP -LocalPort 1883 -Action Allow
listener 1883
allow_anonymous true